[package]
name = "dtlc"
version = "0.1.0"
edition = "2021"

[dependencies]
chumsky = { git = "https://github.com/zesterer/chumsky", rev = "9031baf", features = ["label", "nightly"] }
ariadne = "0.4.1"
regex = "1"
codespan = "0.11.1"
codespan-reporting = "0.11.1"
rustyline = "9.0.0"
derive_more = { version = "1.0", features = ["from", "deref", "deref_mut", "add", "as_ref"] }
logru = "0.2.0"
vec1 = "1"
thiserror = "1.0.30"
#anyhow = "1.0.89"
eyre = "0.6.12"
log = "0.4.14"
env_logger = "0.11.5"
itertools = "0.13.0"
home = "0.5.5"

[dev-dependencies]
quickcheck = "1.0.3"
quickcheck_macros = "1.0.0"
walkdir = "2.3.2"
rand = "0.8.5"